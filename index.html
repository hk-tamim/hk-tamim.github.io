<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="My official social media and gaming links.">
    <meta name="theme-color" content="#0b0b14">

    <title>My Links | Link in Bio</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-5yV4F4xK9V0M7Yk4pVQ7hJv2m5N5L5WJ5Q5J7xJ7N5Q7V8Z5J5M5K5L5P5Q5R5S5T5U5V5W5X5Y5Z5"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="page-wrapper">

        <section class="profile-card">

            <!-- Profile -->
            <header class="profile-header">

                <div class="profile-image-wrapper">
                    <div class="profile-ring"></div>

                    <!-- Replace this URL with your profile image -->
                    <img
                        src="https://i.pravatar.cc/300?img=12"
                        alt="Profile picture"
                        class="profile-image"
                    >
                </div>

                <h1 class="profile-name">
                    MD Kabir
                    <span class="verified" aria-label="Verified">
                        <i class="fa-solid fa-circle-check"></i>
                    </span>
                </h1>

                <p class="profile-tagline">
                    Creator • Gamer • Digital Explorer
                </p>

                <p class="profile-description">
                    Welcome to my official link hub. Find all my social
                    media, gaming profiles, and latest content here.
                </p>

            </header>


            <!-- Action Buttons -->
            <section class="links-container" aria-label="Social links">

                <a
                    class="social-link facebook"
                    href="https://facebook.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-platform="Facebook"
                >
                    <span class="icon-box">
                        <i class="fa-brands fa-facebook-f"></i>
                    </span>

                    <span class="link-text">Facebook</span>

                    <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
                </a>


                <a
                    class="social-link tiktok"
                    href="https://www.tiktok.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-platform="TikTok"
                >
                    <span class="icon-box">
                        <i class="fa-brands fa-tiktok"></i>
                    </span>

                    <span class="link-text">TikTok</span>

                    <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
                </a>


                <a
                    class="social-link instagram"
                    href="https://www.instagram.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-platform="Instagram"
                >
                    <span class="icon-box">
                        <i class="fa-brands fa-instagram"></i>
                    </span>

                    <span class="link-text">Instagram</span>

                    <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
                </a>


                <a
                    class="social-link whatsapp"
                    href="https://wa.me/"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-platform="WhatsApp"
                >
                    <span class="icon-box">
                        <i class="fa-brands fa-whatsapp"></i>
                    </span>

                    <span class="link-text">WhatsApp</span>

                    <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
                </a>


                <a
                    class="social-link telegram"
                    href="https://t.me/"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-platform="Telegram"
                >
                    <span class="icon-box">
                        <i class="fa-brands fa-telegram"></i>
                    </span>

                    <span class="link-text">Telegram</span>

                    <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
                </a>


                <a
                    class="social-link youtube"
                    href="https://www.youtube.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-platform="YouTube"
                >
                    <span class="icon-box">
                        <i class="fa-brands fa-youtube"></i>
                    </span>

                    <span class="link-text">YouTube</span>

                    <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
                </a>


                <!-- Gaming -->
                <a
                    class="social-link gaming"
                    href="https://discord.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-platform="Gaming Profile"
                >
                    <span class="icon-box">
                        <i class="fa-brands fa-discord"></i>
                    </span>

                    <span class="link-text">Gaming Profile</span>

                    <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
                </a>

            </section>


            <!-- Profile Actions -->
            <section class="profile-actions">

                <button
                    class="action-button"
                    id="shareButton"
                    type="button"
                >
                    <i class="fa-solid fa-share-nodes"></i>
                    <span>Share Profile</span>
                </button>

                <button
                    class="action-button secondary"
                    id="copyButton"
                    type="button"
                >
                    <i class="fa-solid fa-link"></i>
                    <span>Copy Profile Link</span>
                </button>

            </section>


            <!-- Footer -->
            <footer class="profile-footer">

                <div class="footer-line"></div>

                <p>
                    Made with <i class="fa-solid fa-heart"></i>
                </p>

                <span class="copyright">
                    © <span id="currentYear"></span> MD Kabir
                </span>

            </footer>

        </section>

    </main>


    <!-- Toast Notification -->
    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
    >
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMessage">Done!</span>
    </div>


    <script src="script.js"></script>

</body>
</html>
